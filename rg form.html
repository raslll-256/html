<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>
</head>

<body bgcolor="lightgreen">

<center>
<h1>STUDENT REGISTRATION FORM</h1>

<form>
Name:
<input type="text" id="name"><br><br>

Register Number:
<input type="text" id="reg"><br><br>

Age:
<input type="number" id="age"><br><br>

Gender:
<input type="radio" name="gender" value="Male">Male
<input type="radio" name="gender" value="Female">Female
<br><br>

Course:
<select id="course">
<option>BCA</option>
<option>BBA</option>
<option>B.Com</option>
<option>B.Sc</option>
</select>
<br><br>

Email:
<input type="email" id="email"><br><br>

Phone Number:
<input type="text" id="phone"><br><br>
Address:
<textarea id="address"></textarea>
<br><br>

<input type="button" value="Submit" onclick="display()">
<input type="reset" value="Reset">

</form>

<h2>Registration Details</h2>
<p id="result"></p>
<script>
function display()
{
var a = document.getElementById("name").value;
var b = document.getElementById("reg").value;
var c = document.getElementById("age").value;
var d = document.getElementById("email").value;

document.write("<h1>Registration Details</h1>");
document.write("Name: " + a.toUpperCase() + "<br><br>");
document.write("Register Number: " + b + "<br><br>");
document.write("Age: " + c + "<br><br>");
document.write("Email: " + d.toLowerCase() + "<br><br>");
}
</script>
</body>
</html>
